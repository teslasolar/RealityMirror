<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Forge v0.2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Courier New', monospace; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: fixed; top: 8px; left: 8px; color: #0ff;
      background: rgba(0,6,12,0.88); padding: 8px 10px; border-radius: 6px;
      z-index: 100; font-size: 9px; border: 1px solid #0ff2;
      backdrop-filter: blur(10px); max-width: 185px;
    }
    #ui h1 { font-size: 11px; color: #ffd700; margin-bottom: 4px; }
    #gen { color: #0f0; font-size: 8px; max-height: 70px; overflow: hidden; margin-top: 4px; }

    /* Bio-monitor HUD - right panel */
    #bio-hud {
      position: fixed; top: 8px; right: 8px;
      background: rgba(0,6,12,0.88); padding: 8px 10px; border-radius: 6px;
      z-index: 100; font-size: 9px; color: #e0e0e0;
      border: 1px solid #4a2a6a44; backdrop-filter: blur(10px);
      width: 200px;
    }
    #bio-hud h2 { font-size: 10px; color: #c084fc; margin-bottom: 6px; }
    .bio-section { margin-bottom: 6px; }
    .bio-section h3 { font-size: 8px; color: #666; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 1px; }
    .bio-bar {
      display: flex; align-items: center; gap: 4px; margin: 1px 0;
    }
    .bio-bar .label { width: 55px; color: #888; font-size: 8px; text-align: right; }
    .bio-bar .track {
      flex: 1; height: 4px; background: #111; border-radius: 2px; overflow: hidden;
    }
    .bio-bar .fill {
      height: 100%; border-radius: 2px; transition: width 0.3s ease;
    }
    .bio-bar .val { width: 28px; font-size: 8px; color: #555; }

    .kappa-main {
      text-align: center; padding: 6px 0; margin: 4px 0;
      border-top: 1px solid #222; border-bottom: 1px solid #222;
    }
    .kappa-main .value {
      font-size: 20px; font-weight: bold;
      background: linear-gradient(135deg, #0ff, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .kappa-main .phase-badge {
      display: inline-block; padding: 1px 6px; border-radius: 8px;
      font-size: 8px; margin-top: 2px;
    }

    #kappa-graph {
      width: 100%; height: 30px; margin-top: 4px;
    }

    /* Sub-agent tasks */
    #agent-tasks {
      position: fixed; bottom: 8px; right: 8px;
      background: rgba(0,6,12,0.88); padding: 6px 8px; border-radius: 6px;
      z-index: 100; font-size: 8px; color: #888;
      border: 1px solid #2a2a2a; backdrop-filter: blur(10px);
      width: 200px; max-height: 100px; overflow: hidden;
    }
    #agent-tasks h3 { font-size: 9px; color: #4a8a4a; margin-bottom: 3px; }
    .task-line { display: flex; gap: 4px; margin: 1px 0; }
    .task-line .dot {
      width: 5px; height: 5px; border-radius: 50%; margin-top: 1px; flex-shrink: 0;
    }
    .task-line .dot.done { background: #2a6a2a; }
    .task-line .dot.running { background: #6a6a2a; animation: pulse 1s infinite; }
    .task-line .dot.queued { background: #333; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    #lyric {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      color: #ffd700; background: rgba(0,6,12,0.88); padding: 5px 16px;
      border-radius: 14px; z-index: 100; font-size: 10px;
      border: 1px solid #ffd70022; backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>INFINITY FORGE v0.2</h1>
    <div>kappa=1/phi | Trits:{-1,0,1}</div>
    <div id="stats">Booting...</div>
    <div id="gen"></div>
  </div>

  <div id="bio-hud">
    <h2>BIO DYNAMICS</h2>
    <div class="kappa-main">
      <div class="value" id="kappa-val">0.6180</div>
      <div>kappa_biological</div>
      <div class="phase-badge" id="phase-badge" style="background:#2a4a6a;color:#8ac">baseline</div>
    </div>
    <canvas id="kappa-graph"></canvas>

    <div class="bio-section" id="sensory-bars"></div>
    <div class="bio-section" id="hormonal-bars"></div>
    <div class="bio-section" id="neural-bars"></div>
  </div>

  <div id="agent-tasks">
    <h3>SUB-AGENTS</h3>
    <div id="task-list"></div>
  </div>

  <div id="lyric">Forging geometries...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module">
    import { GeometryAgent, PHI, INV_PHI, TAU } from './js/geometry.js';
    import { createScene, animateCamera, animateLights } from './js/scene.js';
    import { createMirrors, animateMirrors } from './js/mirrors.js';
    import { createParticles, animateParticles } from './js/particles.js';
    import { HumanSystem, SubAgentMonitor } from './js/bio-monitor.js';

    // --- Init ---
    const { scene, camera, renderer, lights } = createScene();
    const mirrorData = createMirrors(scene);
    const particleData = createParticles(scene);

    // Geometry agents - more of them, with new shapes
    const agents = Array.from({ length: 10 }, (_, i) => new GeometryAgent(i));
    const gGroups = [];
    const gMats = [];

    agents.forEach((r, i) => {
      const g = new THREE.Group();
      gGroups.push(g);
      scene.add(g);
      gMats.push({
        line: new THREE.LineBasicMaterial({
          color: new THREE.Color().setHSL(i / 10, 1.0, 0.7),
          transparent: true, opacity: 0.9, linewidth: 2
        }),
        points: new THREE.PointsMaterial({
          color: new THREE.Color().setHSL(i / 10, 1, 0.75),
          size: 0.12, transparent: true, opacity: 0.95,
          blending: THREE.AdditiveBlending, depthWrite: false
        })
      });
    });

    // --- Bio systems ---
    const bioSystem = new HumanSystem();
    const subAgents = new SubAgentMonitor();

    // Chat reactivity state
    let chatEnergy = 0;        // 0-1, spikes on chat messages, decays over time
    let chatHueShift = 0;      // hue offset from chat sentiment
    let chatPulseScale = 1;    // crystal pulse multiplier
    let lastChatText = '';
    let chatMessageCount = 0;

    // Sentiment keywords that affect the forge
    const energyWords = ['do', 'start', 'now', 'today', 'progress', 'go', 'ship', 'build', 'push', 'commit', 'deploy', 'finish'];
    const chillWords = ['chill', 'vibe', 'bro', 'dude', 'sprint', 'backlog', 'later', 'tomorrow', 'rest', 'relax', 'wait', 'maybe'];
    const frustrationWords = ['hate', 'fine', 'blocking', 'never', 'ugh', 'stop', 'no', 'cant', 'stuck', 'broken'];

    function analyzeChatSentiment(text, role) {
      const lower = text.toLowerCase();
      const words = lower.split(/\s+/);
      let energy = 0.3; // base spike just for any message

      const eHits = words.filter(w => energyWords.some(e => w.includes(e))).length;
      const cHits = words.filter(w => chillWords.some(c => w.includes(c))).length;
      const fHits = words.filter(w => frustrationWords.some(f => w.includes(f))).length;

      // User messages = determination energy (blue/cyan shift)
      // Reality messages = chill energy (warm/red shift)
      if (role === 'me') {
        energy += eHits * 0.15 + fHits * 0.1;
        chatHueShift = -0.1 - eHits * 0.05; // toward blue
      } else {
        energy += cHits * 0.1;
        chatHueShift = 0.08 + cHits * 0.03;  // toward warm
      }

      // Frustration = extra visual chaos
      if (fHits > 0) energy += 0.2;

      return Math.min(1, energy);
    }

    // Listen for chat messages from reality-comic via parent relay
    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'chat-event') return;
      const { role, text } = e.data;
      lastChatText = text;
      chatMessageCount++;

      // Spike energy
      chatEnergy = Math.min(1, chatEnergy + analyzeChatSentiment(text, role));
      chatPulseScale = 1.5 + chatEnergy * 0.5;

      // Show chat text in lyric bar
      const prefix = role === 'me' ? 'ME: ' : 'REALITY: ';
      document.getElementById('lyric').textContent = prefix + text.slice(0, 60);

      // Trigger agent mutations on high-energy messages
      if (chatEnergy > 0.6) {
        const victim = agents[Math.floor(Math.random() * agents.length)];
        victim.task = ['spiral','wave','fractal','torus','crystal','helix','mobius','klein'][Math.floor(Math.random() * 8)];
        victim.mutations++;
        victim.energy = 1.0;
      }
    });

    // User tracking
    let mouseX = 0, mouseY = 0, lastMouseX = 0, lastMouseY = 0;
    let mouseVelocity = 0, lastInteraction = Date.now(), sessionStart = Date.now();
    let interacting = false;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      lastInteraction = Date.now();
      interacting = true;
    });
    document.addEventListener('click', () => { lastInteraction = Date.now(); interacting = true; });
    document.addEventListener('wheel', () => { lastInteraction = Date.now(); interacting = true; });

    // --- HUD rendering ---
    function renderBars(containerId, title, data, colorHue) {
      const el = document.getElementById(containerId);
      let html = `<h3>${title}</h3>`;
      Object.entries(data).forEach(([key, val]) => {
        const pct = (Math.min(1, Math.max(0, val)) * 100).toFixed(0);
        const hue = colorHue + (Object.keys(data).indexOf(key) * 15);
        html += `<div class="bio-bar">
          <span class="label">${key}</span>
          <div class="track"><div class="fill" style="width:${pct}%;background:hsl(${hue},70%,50%)"></div></div>
          <span class="val">${val.toFixed(2)}</span>
        </div>`;
      });
      el.innerHTML = html;
    }

    function renderKappaGraph(history) {
      const canvas = document.getElementById('kappa-graph');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth * 2;
      canvas.height = canvas.offsetHeight * 2;
      ctx.scale(2, 2);
      const w = canvas.offsetWidth, h = canvas.offsetHeight;

      ctx.clearRect(0, 0, w, h);

      // Golden ratio reference line
      const goldenY = h - (INV_PHI * h);
      ctx.strokeStyle = '#ffd70033';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(0, goldenY);
      ctx.lineTo(w, goldenY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Kappa line
      if (history.length < 2) return;
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      history.forEach((v, i) => {
        const x = (i / (history.length - 1)) * w;
        const y = h - (v * h);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Glow effect
      ctx.strokeStyle = '#0ff44';
      ctx.lineWidth = 3;
      ctx.beginPath();
      history.forEach((v, i) => {
        const x = (i / (history.length - 1)) * w;
        const y = h - (v * h);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function renderTasks(status) {
      const el = document.getElementById('task-list');
      let html = '';
      if (status.running) {
        html += `<div class="task-line"><span class="dot running"></span>${status.running}</div>`;
      }
      status.recent.reverse().slice(0, 4).forEach(t => {
        const cls = t.status === 'done' ? 'done' : 'queued';
        html += `<div class="task-line"><span class="dot ${cls}"></span>${t.name} <span style="color:#444">${t.duration}ms</span></div>`;
      });
      html += `<div style="color:#444;margin-top:2px">Q:${status.queued} | Done:${status.completed}</div>`;
      el.innerHTML = html;
    }

    const phaseColors = {
      peak: { bg: '#3a2a1a', color: '#ffa' },
      flow: { bg: '#1a3a2a', color: '#afa' },
      baseline: { bg: '#2a3a4a', color: '#8ac' },
      rest: { bg: '#2a2a3a', color: '#aaf' }
    };

    function updateBioHUD(report) {
      document.getElementById('kappa-val').textContent = report.kappa.toFixed(4);

      const badge = document.getElementById('phase-badge');
      const pc = phaseColors[report.phase] || phaseColors.baseline;
      badge.style.background = pc.bg;
      badge.style.color = pc.color;
      badge.textContent = report.phase + ' | R:' + report.resonance.toFixed(2);

      renderBars('sensory-bars', 'SENSORY', report.sensory, 180);
      renderBars('hormonal-bars', 'HORMONAL', report.hormonal, 280);
      renderBars('neural-bars', 'NEURAL', report.neural, 120);
      renderKappaGraph(report.history);
    }

    // --- Geometry update ---
    function updateGeometries(time) {
      agents.forEach((r, i) => {
        const pts = r.generate(time);
        const g = gGroups[i];
        const m = gMats[i];

        while (g.children.length > 0) {
          const child = g.children[0];
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
          g.remove(child);
        }

        if (pts.length > 2) {
          const cv = pts.map(p => new THREE.Vector3(p.x, p.y, p.z));
          const closed = r.task === 'torus' || r.task === 'mobius' || r.task === 'klein';
          const curve = new THREE.CatmullRomCurve3(cv, closed);
          const sp = curve.getPoints(100);

          // Line
          g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sp), m.line));

          // Points sparkle
          g.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(sp), m.points));

          // Smooth tube contour
          if (pts.length > 5) {
            try {
              const tubeRadius = 0.04 + r.entropy() * 0.06;
              const tg = new THREE.TubeGeometry(curve, 60, tubeRadius, 8, closed);
              const hue = i / 10 + time * 0.00008;
              const tubeMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(hue, 0.9, 0.55),
                metalness: 0.6,
                roughness: 0.3,
                emissive: new THREE.Color().setHSL(hue, 1.0, 0.25),
                emissiveIntensity: 1.2 + r.energy * 0.8 + chatEnergy * 0.5
              });
              g.add(new THREE.Mesh(tg, tubeMat));
            } catch (e) { /* curve degenerate */ }
          }
        }

        g.rotation.y = time * 0.0008 * (r.timeline + 2) * 0.5;
        g.rotation.x = Math.sin(time * 0.0004 + i) * 0.25;
      });
    }

    // --- Lyrics ---
    const lyrics = [
      "Forging infinity mirrors", "kappa = 1/phi", "Trinary geometries emerge",
      "Past[-1] shapes present[0]", "Future[+1] reflects eternal",
      "Smooth contours, infinite depth", "Mirrors within mirrors",
      "The entropy flows golden", "Reality bends here",
      "Mobius paths twist forever", "Klein bottles contain nothing",
      "Helix spirals upward", "Resonance: approaching golden"
    ];
    let lyricIdx = 0;

    // --- Sub-agent background tasks ---
    function scheduleSubAgentTasks(time) {
      if (time % 60 === 0) {
        subAgents.enqueue({
          name: 'kappa_convergence_check',
          fn: () => {
            const avg = agents.reduce((s, a) => s + a.kappa, 0) / agents.length;
            return { avgKappa: avg, deviation: Math.abs(avg - INV_PHI) };
          }
        });
      }
      if (time % 90 === 0) {
        subAgents.enqueue({
          name: 'entropy_audit',
          fn: () => {
            const entropies = agents.map(a => ({ id: a.id, H: a.entropy(), task: a.task }));
            return { min: Math.min(...entropies.map(e => e.H)), max: Math.max(...entropies.map(e => e.H)), agents: entropies };
          }
        });
      }
      if (time % 120 === 0) {
        subAgents.enqueue({
          name: 'bio_phase_analysis',
          fn: () => {
            const report = bioSystem.getReport();
            return { phase: report.phase, resonance: report.resonance, kappa: report.kappa };
          }
        });
      }
      if (time % 150 === 0) {
        subAgents.enqueue({
          name: 'mutation_census',
          fn: () => {
            return agents.map(a => ({ id: a.id, task: a.task, mutations: a.mutations, age: a.age }));
          }
        });
      }
      if (time % 200 === 0) {
        subAgents.enqueue({
          name: 'user_engagement_score',
          fn: () => {
            const idle = Date.now() - lastInteraction;
            return {
              engaged: idle < 5000,
              idleMs: idle,
              sessionSec: Math.floor((Date.now() - sessionStart) / 1000),
              mouseVelocity
            };
          }
        });
      }
    }

    // --- Main loop ---
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time++;

      // Decay chat energy over time
      chatEnergy *= 0.995;
      chatPulseScale += (1 - chatPulseScale) * 0.02;

      // Camera
      animateCamera(camera, time);

      // Mirrors + crystal - apply chat pulse to crystal scale
      animateMirrors(mirrorData, time, renderer, scene);
      mirrorData.crystal.scale.setScalar(
        (1 + Math.sin(time * 0.008) * 0.12) * chatPulseScale
      );
      // Shift inner crystal emissive based on chat
      mirrorData.innerCrystals.forEach((c, i) => {
        if (c.material.emissive) {
          c.material.emissive.setHSL(
            (i / 5 + chatHueShift + time * 0.0001) % 1,
            1.0,
            0.2 + chatEnergy * 0.3
          );
          c.material.emissiveIntensity = 1.5 + chatEnergy * 2;
        }
      });

      // Lights - boost intensity with chat energy
      animateLights(lights, time);
      lights.forEach(l => { l.intensity += chatEnergy * 1.5; });

      // Geometry every 2 frames
      if (time % 2 === 0) updateGeometries(time);

      // Particles - speed up on chat energy
      animateParticles(particleData, time, chatEnergy);

      // Mouse velocity
      mouseVelocity = Math.sqrt((mouseX - lastMouseX) ** 2 + (mouseY - lastMouseY) ** 2);
      lastMouseX = mouseX;
      lastMouseY = mouseY;
      if (Date.now() - lastInteraction > 500) interacting = false;

      // Sub-agent scheduling
      scheduleSubAgentTasks(time);
      subAgents.tick();

      // Bio + HUD update every 15 frames
      if (time % 15 === 0) {
        const totalPoints = agents.reduce((s, a) => s + a.output.length, 0);
        const avgEntropy = agents.reduce((s, a) => s + a.entropy(), 0) / agents.length;
        const avgKappa = agents.reduce((s, a) => s + a.kappa, 0) / agents.length;
        const avgEnergy = agents.reduce((s, a) => s + a.energy, 0) / agents.length;
        const mutations = agents.reduce((s, a) => s + a.mutations, 0);
        const uniqueTasks = new Set(agents.map(a => a.task)).size;

        const report = bioSystem.update(
          { totalPoints, avgEntropy, avgKappa, avgEnergy, mutations, taskDiversity: uniqueTasks },
          { mouseVelocity, interacting, idleTime: Date.now() - lastInteraction, sessionDuration: Date.now() - sessionStart }
        );

        updateBioHUD(report);
        renderTasks(subAgents.getStatus());

        // Forge stats
        document.getElementById('stats').innerHTML =
          `A:${agents.length} | k:${avgKappa.toFixed(3)} | H:${avgEntropy.toFixed(3)} | pts:${totalPoints}`;
        document.getElementById('gen').innerHTML =
          agents.map(a => `${a.id}:${a.task}[${a.timeline}]`).join(' | ');
      }

      // Lyrics
      if (time % 250 === 0) {
        lyricIdx = (lyricIdx + 1) % lyrics.length;
        document.getElementById('lyric').textContent = lyrics[lyricIdx];
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
