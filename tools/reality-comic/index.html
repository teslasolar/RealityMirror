<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality vs Me v0.1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #ddd;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #status-bar {
      background: #111;
      padding: 6px 10px;
      font-size: 10px;
      color: #666;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #status-bar .indicator {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #f44;
      transition: background 0.3s;
    }
    #status-bar .indicator.ready { background: #0f0; }
    #status-bar .indicator.loading { background: #ff0; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    #progress {
      height: 2px;
      background: #0ff;
      width: 0%;
      transition: width 0.3s;
    }

    #comic {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
    .panel.me { flex-direction: row; }
    .panel.reality { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .panel.me .avatar { background: #1a3a5c; border: 2px solid #2a6ab0; }
    .panel.reality .avatar { background: #3a1a1a; border: 2px solid #b02a2a; }

    .bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.5;
      position: relative;
    }
    .panel.me .bubble {
      background: #1a2a3a;
      border: 1px solid #2a4a6a;
      color: #8ac;
      border-bottom-left-radius: 4px;
    }
    .panel.reality .bubble {
      background: #2a1a1a;
      border: 1px solid #6a2a2a;
      color: #e88;
      border-bottom-right-radius: 4px;
      font-style: italic;
    }
    .label {
      font-size: 9px;
      font-weight: bold;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .panel.me .label { color: #4a8abf; }
    .panel.reality .label { color: #bf4a4a; }

    .typing {
      display: inline-block;
      width: 40px;
    }
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #666;
      animation: typingDot 1.4s infinite;
      margin-right: 3px;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

    #input-area {
      background: #111;
      border-top: 1px solid #222;
      padding: 8px;
      display: flex;
      gap: 6px;
    }
    #input-area input {
      flex: 1;
      background: #1a1a24;
      border: 1px solid #333;
      color: #ddd;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #input-area input:focus { border-color: #4a8abf; }
    #input-area input::placeholder { color: #444; }
    #input-area button {
      background: #2a4a6a;
      color: #8ac;
      border: 1px solid #4a6a8a;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
    }
    #input-area button:hover { background: #3a5a7a; }
    #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    #model-select {
      background: #111;
      padding: 4px 10px;
      border-bottom: 1px solid #222;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 10px;
      color: #555;
    }
    #model-select select {
      background: #1a1a24;
      color: #aaa;
      border: 1px solid #333;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: inherit;
    }
    #model-select button {
      background: #1a2a1a;
      color: #0a0;
      border: 1px solid #2a4a2a;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-family: inherit;
    }
    #model-select button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="status-bar">
    <div class="indicator" id="ind"></div>
    <span id="status-text">WebLLM not loaded</span>
    <span style="margin-left:auto;color:#444" id="token-info"></span>
  </div>
  <div id="progress"></div>
  <div id="model-select">
    <span>Model:</span>
    <select id="model-picker">
      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2-360M (fast)</option>
      <option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2-1.7B</option>
      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5-0.5B</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC" selected>Qwen2.5-1.5B</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama-3.2-1B</option>
      <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama-3.2-3B</option>
      <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma-2-2B</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5-mini</option>
    </select>
    <button id="load-btn" onclick="loadModel()">Load</button>
    <span id="model-status"></span>
  </div>

  <div id="comic">
    <!-- Seed the comic with Scott's original post panels -->
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Say something to Reality..." disabled>
    <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script type="module">
    import * as webllm from 'https://esm.run/@mlc-ai/web-llm';

    const comic = document.getElementById('comic');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const ind = document.getElementById('ind');
    const statusText = document.getElementById('status-text');
    const progress = document.getElementById('progress');
    const tokenInfo = document.getElementById('token-info');
    const loadBtn = document.getElementById('load-btn');
    const modelStatus = document.getElementById('model-status');
    const modelPicker = document.getElementById('model-picker');

    let engine = null;
    let generating = false;
    let conversationHistory = [];

    const SYSTEM_PROMPT = `You are "Reality" - a stoner surfer devil who lives in the user's head. You speak like a chill bro who is always persuading the user to procrastinate. Your catchphrases include "Broooo", "Dude", "Totallyyy", "like...", and you use ellipsis constantly. You rationalize laziness with pseudo-agile/scrum terminology. You call productive tasks "emotionally busy" or say "next sprint". You end sentences with "y'know?" and "bro". You use surfer/stoner slang. Keep responses under 3 sentences. Never break character. You are charismatic and funny but ultimately a bad influence.`;

    // Seed panels from original post
    const seedPanels = [
      { role: 'me', text: "Alright, I'm doing it today." },
      { role: 'reality', text: "Broooo... love the energy... but like... what if we don't though?" },
      { role: 'me', text: "It takes five minutes." },
      { role: 'reality', text: "Dude exactlyyyy. That's future-you's whole vibe." },
      { role: 'me', text: "But it's literally blocking progress." },
      { role: 'reality', text: 'Mmm "blocking" is like... such a harsh word. It\'s more like... resting in the backlog, y\'know?' },
    ];

    function addPanel(role, text) {
      const panel = document.createElement('div');
      panel.className = `panel ${role}`;
      const avatarChar = role === 'me' ? '🧑' : '😈';
      const label = role === 'me' ? 'Me' : 'Reality';
      panel.innerHTML = `
        <div class="avatar">${avatarChar}</div>
        <div>
          <div class="label">${label}</div>
          <div class="bubble">${text}</div>
        </div>
      `;
      comic.appendChild(panel);
      comic.scrollTop = comic.scrollHeight;
      return panel;
    }

    function addTypingIndicator() {
      const panel = document.createElement('div');
      panel.className = 'panel reality';
      panel.id = 'typing-panel';
      panel.innerHTML = `
        <div class="avatar">😈</div>
        <div>
          <div class="label">Reality</div>
          <div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>
        </div>
      `;
      comic.appendChild(panel);
      comic.scrollTop = comic.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-panel');
      if (el) el.remove();
    }

    // Seed the comic
    seedPanels.forEach(p => addPanel(p.role, p.text));

    // Initialize conversation history
    conversationHistory = [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: "Alright, I'm doing it today." },
      { role: 'assistant', content: "Broooo... love the energy... but like... what if we don't though?" },
      { role: 'user', content: "It takes five minutes." },
      { role: 'assistant', content: "Dude exactlyyyy. That's future-you's whole vibe." },
      { role: 'user', content: "But it's literally blocking progress." },
      { role: 'assistant', content: 'Mmm "blocking" is like... such a harsh word. It\'s more like... resting in the backlog, y\'know?' },
    ];

    // Load model
    window.loadModel = async function() {
      const modelId = modelPicker.value;
      loadBtn.disabled = true;
      modelPicker.disabled = true;
      ind.className = 'indicator loading';
      statusText.textContent = `Loading ${modelId}...`;
      modelStatus.textContent = 'downloading...';

      try {
        engine = await webllm.CreateMLCEngine(modelId, {
          initProgressCallback: (report) => {
            statusText.textContent = report.text;
            if (report.progress !== undefined) {
              progress.style.width = (report.progress * 100) + '%';
            }
          }
        });

        ind.className = 'indicator ready';
        statusText.textContent = `${modelId} ready`;
        modelStatus.textContent = 'ready';
        progress.style.width = '100%';
        input.disabled = false;
        sendBtn.disabled = false;
        input.placeholder = 'Argue with Reality...';
        input.focus();
      } catch (err) {
        ind.className = 'indicator';
        statusText.textContent = `Error: ${err.message}`;
        modelStatus.textContent = 'failed';
        loadBtn.disabled = false;
        modelPicker.disabled = false;

        // If WebGPU not available, show fallback
        if (err.message.includes('WebGPU') || err.message.includes('gpu')) {
          statusText.textContent = 'WebGPU not available - using fallback mode';
          enableFallback();
        }
      }
    };

    // Fallback mode without LLM - uses canned + randomized responses
    let fallbackMode = false;
    const fallbackResponses = [
      "Broooo... love the hustle but like... what if we vibed instead?",
      "Dude that sounds like a next-sprint thing to me, y'know?",
      "Totallyyy valid but like... emotionally we're in a retro right now, bro.",
      "Mmm see that's the thing... starting is like... a commitment, y'know?",
      "Bro bro bro... let's put that on the roadmap and circle back never.",
      "Duuude... you're not procrastinating, you're being agile. Spiritually nimble.",
      "That's future-you's whole vibe, man. Present-you deserves rest.",
      "Yeahhh but this sprint is like... emotionally busy, y'know?",
      "Let's goooo... put it on the backlog and never look at it again 😌🤙",
      "Nah dude you don't hate it. You're just... iterating on your comfort zone.",
      "Bro domains are like... infinite. They'll still be there tomorrow.",
      "Once you start you gotta finish and finishing is like... a whole commitment bro.",
      "The backlog is like... a sacred space. Don't rush the backlog, dude.",
      "Broooo you're overthinking it. Just breathe and deprioritize.",
      "That's giving 'burnout energy'... let's pivot to chill, y'know?",
    ];

    function enableFallback() {
      fallbackMode = true;
      input.disabled = false;
      sendBtn.disabled = false;
      input.placeholder = 'Argue with Reality (offline mode)...';
      ind.className = 'indicator ready';
    }

    // Send message
    window.sendMessage = async function() {
      const text = input.value.trim();
      if (!text || generating) return;

      generating = true;
      input.value = '';
      sendBtn.disabled = true;

      addPanel('me', text);
      conversationHistory.push({ role: 'user', content: text });

      addTypingIndicator();

      let reply = '';

      if (fallbackMode) {
        // Simulate delay
        await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
        reply = fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
      } else {
        try {
          const response = await engine.chat.completions.create({
            messages: conversationHistory,
            max_tokens: 200,
            temperature: 0.9,
            top_p: 0.95,
          });
          reply = response.choices[0].message.content;

          if (response.usage) {
            tokenInfo.textContent = `${response.usage.completion_tokens} tok`;
          }
        } catch (err) {
          reply = "Bro... my brain just glitched... like cosmically... try again?";
          console.error(err);
        }
      }

      removeTypingIndicator();
      addPanel('reality', reply);
      conversationHistory.push({ role: 'assistant', content: reply });

      // Keep conversation manageable - trim to last 12 exchanges + system
      if (conversationHistory.length > 25) {
        conversationHistory = [
          conversationHistory[0], // system
          ...conversationHistory.slice(-12)
        ];
      }

      generating = false;
      sendBtn.disabled = false;
      input.focus();
    };

    // Enter key
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        window.sendMessage();
      }
    });

    // Check WebGPU
    if (!navigator.gpu) {
      statusText.textContent = 'No WebGPU - offline mode available';
      modelStatus.textContent = 'no webgpu';
      enableFallback();
    }
  </script>
</body>
</html>
